<html>
  <head>
    <title>OrionPulse Agent</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; }
      .wrap { max-width: 920px; margin: 24px auto; padding: 0 16px; }
      .card { background: #fff; border: 1px solid #e4e8f0; border-radius: 12px; padding: 16px; }
      h2 { margin-top: 0; }
      textarea { width: 100%; min-height: 90px; padding: 10px; border-radius: 8px; border: 1px solid #cdd5e1; }
      .row { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
      button { background: #1f6feb; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
      button:disabled { opacity: 0.6; cursor: not-allowed; }
      .muted { color: #566076; font-size: 13px; }
      .thread { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
      .bubble-q { align-self: flex-end; background: #1f6feb; color: #fff; border-radius: 16px 16px 4px 16px; padding: 10px 14px; max-width: 80%; font-size: 14px; line-height: 1.4; }
      .bubble-a { align-self: flex-start; background: #fff; border: 1px solid #e4e8f0; border-radius: 4px 16px 16px 16px; padding: 14px; width: 100%; box-sizing: border-box; }
      .bubble-a h3 { margin: 0 0 6px; font-size: 14px; color: #566076; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
      .bubble-a p { margin: 0 0 10px; color: #2d3a4f; line-height: 1.5; }
      .charts-grid { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
      .chart-card { border: 1px solid #e4e8f0; border-radius: 8px; overflow: hidden; flex: 1 1 260px; }
      .chart-card img { width: 100%; display: block; }
      .chart-label { font-size: 11px; color: #566076; padding: 5px 8px; background: #f6f8fb; text-align: center; }
      .followup { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
      .followup-chip { font-size: 13px; color: #1f6feb; background: #eef4ff; border: 1px solid #b6d0ff; border-radius: 20px; padding: 5px 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
      .followup-chip:hover { background: #d6e8ff; border-color: #1f6feb; }
      .followup-chip.used { color: #999; background: #f4f4f4; border-color: #ddd; cursor: default; text-decoration: line-through; pointer-events: none; }
      .raw-toggle { font-size: 12px; color: #888; cursor: pointer; margin-top: 10px; display: inline-block; }
      .raw-json { display: none; white-space: pre-wrap; background: #0b1020; color: #d9e0ff; border-radius: 8px; padding: 12px; margin-top: 8px; max-height: 300px; overflow: auto; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class='wrap'>
      <div class='card'>
        <h2>OrionPulse Agent</h2>
        <p class='muted'>Ask business questions, optionally generate charts and BI export packs.</p>
        <textarea id='q' placeholder='Example: why did margin drop in APAC and show charts'></textarea>
        <div class='row'>
          <label><input type='checkbox' id='withVisuals' checked /> Include visuals</label>
          <label><input type='checkbox' id='withBI' /> Include BI exports</label>
          <label><input type='checkbox' id='autoSpeak' checked /> Auto speak answer</label>
          <select id='fmt'>
            <option value='png'>png</option>
            <option value='svg'>svg</option>
            <option value='csv'>csv (BI)</option>
          </select>
          <button id='askBtn' onclick='askAgent()'>Ask Agent</button>
          <button id='micBtn' onclick='toggleMic()'>🎤 Start Listening</button>
          <button id='stopSpeakBtn' onclick='stopSpeaking()'>⏹ Stop Voice</button>
        </div>
        <div class='row'>
          <label>Voice:
            <select id='voiceSelect'></select>
          </label>
          <label>Rate:
            <input id='rate' type='range' min='0.7' max='1.3' step='0.1' value='1.0' />
          </label>
          <span id='micStatus' class='muted'>Mic: idle</span>
          <span id='modeInfo' class='muted'>Mode: -</span>
          <span id='fallbackInfo' class='muted'>Fallback: none</span>
          <span id='freshnessInfo' class='muted'>Data: —</span>
        </div>
        <div class='row'>
          <span id='warningInfo' class='muted'>Warnings: none</span>
        </div>
        <div id='thread' class='thread'></div>
      </div>
    </div>
    <script>
      let recognition = null;
      let recognizing = false;
      let voices = [];

      function loadVoices() {
        voices = speechSynthesis.getVoices() || [];
        const sel = document.getElementById('voiceSelect');
        sel.innerHTML = '';
        voices.forEach((v, i) => {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = `${v.name} (${v.lang})`;
          sel.appendChild(opt);
        });
        if (!voices.length) {
          const opt = document.createElement('option');
          opt.value = '-1';
          opt.textContent = 'Default voice';
          sel.appendChild(opt);
        }
      }

      function initMic() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          document.getElementById('micStatus').textContent = 'Mic: SpeechRecognition not supported';
          document.getElementById('micBtn').disabled = true;
          return;
        }
        recognition = new SR();
        recognition.lang = 'en-US';
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.onstart = () => {
          recognizing = true;
          document.getElementById('micStatus').textContent = 'Mic: listening...';
          document.getElementById('micBtn').textContent = '🛑 Stop Listening';
        };
        recognition.onend = () => {
          recognizing = false;
          document.getElementById('micStatus').textContent = 'Mic: idle';
          document.getElementById('micBtn').textContent = '🎤 Start Listening';
        };
        recognition.onresult = (e) => {
          let transcript = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            transcript += e.results[i][0].transcript;
          }
          document.getElementById('q').value = transcript.trim();
        };
        recognition.onerror = (e) => {
          document.getElementById('micStatus').textContent = 'Mic error: ' + e.error;
        };
      }

      function toggleMic() {
        if (!recognition) return;
        if (recognizing) recognition.stop();
        else recognition.start();
      }

      function stopSpeaking() {
        speechSynthesis.cancel();
      }

      function speakText(text) {
        if (!text) return;
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        const sel = document.getElementById('voiceSelect');
        const idx = Number(sel.value || -1);
        if (idx >= 0 && voices[idx]) utt.voice = voices[idx];
        utt.rate = Number(document.getElementById('rate').value || 1.0);
        speechSynthesis.speak(utt);
      }

      function useFollowup(text, el) {
        if (el) {
          el.classList.add('used');
          el.textContent = '✓ ' + text;
        }
        document.getElementById('q').value = text;
        askAgent();
      }

      // Safe DOM builder: creates an element, optionally sets a class and text content.
      function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined && text !== null) node.textContent = text;
        return node;
      }

      async function askAgent() {
        const q = document.getElementById('q').value.trim();
        const withVisuals = document.getElementById('withVisuals').checked;
        const withBI = document.getElementById('withBI').checked;
        const autoSpeak = document.getElementById('autoSpeak').checked;
        const fmt = document.getElementById('fmt').value;
        const thread = document.getElementById('thread');
        const btn = document.getElementById('askBtn');
        if (!q) return;

        // Append user bubble
        const qBubble = el('div', 'bubble-q', q);
        thread.appendChild(qBubble);

        // Append thinking placeholder
        const aBubble = el('div', 'bubble-a');
        const thinkingP = el('p', 'muted', 'Thinking…');
        aBubble.appendChild(thinkingP);
        thread.appendChild(aBubble);
        aBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });

        btn.disabled = true;
        document.getElementById('q').value = '';

        try {
          const resp = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ q, with_visuals: withVisuals, with_bi: withBI, fmt })
          });
          const data = await resp.json();
          const modeText = data?.execution_mode || '-';
          const fallback = data?.fallback_reason || 'none';
          const warnings = Array.isArray(data?.warnings) ? data.warnings : [];
          document.getElementById('modeInfo').textContent = `Mode: ${modeText}`;
          document.getElementById('fallbackInfo').textContent = `Fallback: ${fallback}`;
          document.getElementById('warningInfo').textContent = `Warnings: ${warnings.length ? warnings.join(' | ') : 'none'}`;

          const ts = data?.timestamp ? new Date(data.timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
          document.getElementById('freshnessInfo').textContent = `Data as of: ${ts}`;

          const inner = data?.data || {};
          const answer = inner.answer || '';
          const visuals = inner.visuals?.visuals || [];
          const followups = inner.followups || [];

          // Clear the thinking placeholder
          aBubble.textContent = '';

          // Answer section — textContent prevents HTML injection
          if (answer) {
            aBubble.appendChild(el('h3', null, 'Answer'));
            aBubble.appendChild(el('p', null, answer));
          }

          // Charts grid — img src/alt set via properties, label via textContent
          if (visuals.length) {
            aBubble.appendChild(el('h3', null, 'Charts'));
            const grid = el('div', 'charts-grid');
            visuals.forEach(v => {
              const card = el('div', 'chart-card');
              const img = document.createElement('img');
              img.src = '/' + String(v.path || '').replace(/\\/g, '/');
              img.alt = String(v.chart_type || '').replace(/_/g, ' ');
              const lbl = el('div', 'chart-label', img.alt);
              card.appendChild(img);
              card.appendChild(lbl);
              grid.appendChild(card);
            });
            aBubble.appendChild(grid);
          }

          // Follow-up chips — text set via textContent, click via addEventListener
          if (followups.length) {
            const chipRow = el('div', 'followup');
            followups.forEach(f => {
              const chip = el('span', 'followup-chip', '💡 ' + f);
              chip.addEventListener('click', function() { useFollowup(f, this); });
              chipRow.appendChild(chip);
            });
            aBubble.appendChild(chipRow);
          }

          // Raw JSON toggle — JSON.stringify output set via textContent
          const rawId = 'raw-' + Date.now();
          const toggle = el('span', 'raw-toggle', '▶ Show raw JSON');
          toggle.addEventListener('click', function() {
            const pre = document.getElementById(rawId);
            pre.style.display = pre.style.display === 'none' ? 'block' : 'none';
          });
          const rawPre = el('pre', 'raw-json');
          rawPre.id = rawId;
          rawPre.style.display = 'none';
          rawPre.textContent = JSON.stringify(data, null, 2);
          aBubble.appendChild(toggle);
          aBubble.appendChild(rawPre);

          aBubble.scrollIntoView({ behavior: 'smooth', block: 'start' });

          if (autoSpeak && answer) speakText(answer);
        } catch (e) {
          aBubble.textContent = '';
          const errP = el('p', null, 'Error: ' + e);
          errP.style.color = '#c0392b';
          aBubble.appendChild(errP);
        } finally {
          btn.disabled = false;
        }
      }

      window.speechSynthesis?.addEventListener?.('voiceschanged', loadVoices);
      loadVoices();
      initMic();
    </script>
  </body>
</html>
