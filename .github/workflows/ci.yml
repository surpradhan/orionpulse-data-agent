name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Preflight
        run: python scripts/preflight.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports src/orion_sales_agent/config.py src/orion_sales_agent/analytics.py src/orion_sales_agent/webapp.py

      - name: Tests
        run: pytest
